[package]
name = "sigmaos-linuxmint"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Linux Mint inspirations"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-linuxmint"
readme = "README.md"
keywords = ["linuxmint", "inspirations", "mint"]
categories = ["development-tools"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
